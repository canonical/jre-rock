summary: Default truststore is built from Ubuntu ca-certificates

execute: |
  # piped, since the docker snap may not write to redirected files
  docker run --rm ${ROCK} exec keytool -list -cacerts -storepass changeit | tee certs.txt > /dev/null
  grep -q '^debian:' certs.txt
  # no entries from the CA bundle shipped inside the openjdk jmods
  if grep -q '\[jdk\]' certs.txt; then
    exit 1
  fi
  # same roots as the host's keystore, generated by ca-certificates-java
  keytool -list -cacerts -storepass changeit > host-certs.txt
  diff <(grep -o 'SHA-256): [0-9A-F:]*' certs.txt | sort) \
       <(grep -o 'SHA-256): [0-9A-F:]*' host-certs.txt | sort)
