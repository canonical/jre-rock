name: jre
version: 21-edge
base: bare
build-base: ubuntu@24.04
platforms:
  amd64:
  arm64:
  ppc64el:
  s390x:

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-${CRAFT_ARCH_BUILD_FOR}

run-user: _daemon_

summary: OpenJDK 21 headless runtime environment
description: |
  This rock provides OpenJDK 21 runtime environment including the
  following public modules:
  - java.base - the foundational APIs of the Java SE Platform.
  - java.compiler - the Language Model, Annotation Processing,
    and Java Compiler APIs.
  - java.instrument - services that allow agents to instrument
    programs running on the JVM.
  - java.logging - the Java Logging API.
  - java.management - the Java Management Extensions (JMX) API.
  - java.management.rmi - the RMI connector for the Java Management
    Extensions (JMX) Remote API.
  - java.naming - the Java Naming and Directory Interface (JNDI) API.
  - java.net.http - the HTTP Client and WebSocket APIs.
  - java.prefs - the Preferences API.
  - java.rmi - the Remote Method Invocation (RMI) API.
  - java.scripting - the Scripting API.
  - java.se -  the API of the Java SE Platform.
  - java.security.jgss - the Java binding of the IETF Generic
    Security Services API (GSS-API).
  - java.security.sasl - Java support for the IETF Simple
    Authentication and Security Layer (SASL).
  - java.smartcardio - the Java Smart Card I/O API.
  - java.sql - the JDBC API.
  - java.sql.rowset - the JDBC RowSet API.
  - java.transaction.xa - an API for supporting distributed
    transactions in JDBC.
  - java.xml - the Java APIs for XML Processing (JAXP).
  - java.xml.crypto - the API for XML cryptography.
  - jdk.charsets - the  charsets that are not in java.base
    (mostly double byte and IBM charsets).
  - jdk.crypto.cryptoki -the implementation of the SunPKCS11
    security provider.
  - jdk.crypto.ec - the implementation of the SunEC security
    provider.
  - jdk.dynalink - the API for dynamic linking of high-level
    operations on objects.
  - jdk.httpserver -  the JDK-specific HTTP server API, and provides
    the jwebserver tool for running a minimal HTTP server.
  - jdk.jdwp.agent - the implementation of the Java Debug Wire
    Protocol (JDWP) agent.
  - jdk.jfr - the API for JDK Flight Recorder.
  - jdk.jsobject - the API for the JavaScript Object.
  - jdk.localedata - the locale data for locales other than US
    locale.
  - jdk.management - JDK-specific management interfaces for the JVM.
  - jdk.management.agent - the JMX management agent.
  - jdk.management.jfr - the Management Interface for JDK Flight
    Recorder.
  - jdk.naming.dns - the implementation of the DNS Java Naming
    provider.
  - jdk.naming.rmi - the implementation of the RMI Java Naming
    provider.
  - jdk.net -  the JDK-specific Networking API.
  - jdk.nio.mapmode - the JDK-specific file mapping modes.
  - jdk.random - the LXM family of random number generators.
  - jdk.sctp - the JDK-specific API for SCTP.
  - jdk.security.auth - the implementations of the
    javax.security.auth.* interfaces and various authentication
    modules.
  - jdk.security.jgss - the  JDK extensions to the GSS-API and an
    implementation of the SASL GSSAPI mechanism.
  - jdk.unsupported - access to sun.misc.Unsafe
  - jdk.xml.dom  - the subset of the W3C Document Object Model (DOM)
    API that is not part of the Java SE API.
  - jdk.zipfs - the implementation of the Zip file system provider.
  AMD64 and ARM platforms additionally include:
  - jdk.internal.vm.ci - the JVM Compiler Interface (JVMCI) API.
  - jdk.internal.vm.compiler - the Graal JIT compiler implementation.
  - jdk.internal.vm.compiler.management - the management interface for the
    Graal JIT compiler.
parts:
  runtime:
    plugin: nil
    source: https://github.com/canonical/chisel-releases.git
    source-type: git
    source-branch: ubuntu-24.04
    source-depth: 1
    build-snaps:
      - chisel/latest/stable
    override-pull: |
      craftctl default
      # TODO: drop once these are merged into chisel-releases:
      # #1481 (libsctp1), #1494 (sctp slice), #1497 (libsyslookup, release,
      # runtime-tools), #1491 (NSS softoken for the security slice) and #1503
      # (awt-v2 with a trimmed font stack)
      git apply "${CRAFT_PROJECT_DIR}/chisel-releases.patch"
    override-build: |
      JAVA_HOME=usr/lib/jvm/java-21-openjdk-${CRAFT_ARCH_BUILD_FOR}
      cut() {
        chisel cut --release "${CRAFT_PART_SRC}" --arch "${CRAFT_ARCH_BUILD_FOR}" --root "$@"
      }

      # everything shipped comes from slices, except the module image. the core
      # slice brings the deb's lib/modules and release, which are replaced below.
      cut "${CRAFT_PART_INSTALL}" \
        base-files_base \
        base-files_chisel \
        base-files_release-info \
        openjdk-21-jre-headless_core \
        openjdk-21-jre-headless_awt-v2 \
        openjdk-21-jre-headless_console \
        openjdk-21-jre-headless_debug \
        openjdk-21-jre-headless_jfr \
        openjdk-21-jre-headless_management \
        openjdk-21-jre-headless_prefs \
        openjdk-21-jre-headless_rmi \
        openjdk-21-jre-headless_sctp \
        openjdk-21-jre-headless_security \
        openjdk-21-jre-headless_tools \
        openjdk-21-jdk-headless_runtime-tools

      # build-only root with the jmods, jlink and the CA certificates
      BUILD_ROOT="${CRAFT_PART_BUILD}/root"
      rm -rf "${BUILD_ROOT}"
      mkdir -p "${BUILD_ROOT}"
      cut "${BUILD_ROOT}" \
        openjdk-21-jdk-headless_modules \
        openjdk-21-jre-headless_tools \
        ca-certificates_data-with-certs
      # the jdk's config symlinks point at /etc; resolve them so the tools
      # run from the build root without a chroot
      find "${BUILD_ROOT}/${JAVA_HOME}" -type l -lname '/etc/*' | while read -r link; do
        target="${BUILD_ROOT}$(readlink "${link}")"
        if [ -e "${target}" ]; then
          cp --remove-destination "${target}" "${link}"
        fi
      done
      BUILD_JAVA_HOME="${BUILD_ROOT}/${JAVA_HOME}"

      AMD_ARM_MODULES=java.base
      if [[ "$CRAFT_ARCH_BUILD_FOR" =~ ^(amd64|arm64)$ ]]; then
        AMD_ARM_MODULES=jdk.internal.vm.ci,jdk.internal.vm.compiler,jdk.internal.vm.compiler.management
      fi
      # --strip-java-debug-attributes produces the same image as -G without
      # needing objcopy; the native libraries come from the slices
      "${BUILD_JAVA_HOME}/bin/jlink" --add-modules java.base,\
      java.compiler,\
      java.instrument,\
      java.logging,\
      java.management,\
      java.management.rmi,\
      java.naming,\
      java.net.http,\
      java.prefs,\
      java.rmi,\
      java.scripting,\
      java.se,\
      java.security.jgss,\
      java.security.sasl,\
      java.smartcardio,\
      java.sql,\
      java.sql.rowset,\
      java.transaction.xa,\
      java.xml,\
      java.xml.crypto,\
      jdk.charsets,\
      jdk.crypto.cryptoki,\
      jdk.crypto.ec,\
      jdk.dynalink,\
      jdk.httpserver,\
      $AMD_ARM_MODULES,\
      jdk.jdwp.agent,\
      jdk.jfr,\
      jdk.jsobject,\
      jdk.localedata,\
      jdk.management,\
      jdk.management.agent,\
      jdk.management.jfr,\
      jdk.naming.dns,\
      jdk.naming.rmi,\
      jdk.net,\
      jdk.nio.mapmode,\
      jdk.random,\
      jdk.sctp,\
      jdk.security.auth,\
      jdk.security.jgss,\
      jdk.unsupported,\
      jdk.xml.dom,\
      jdk.zipfs --no-header-files --no-man-pages --strip-java-debug-attributes \
      --output "${CRAFT_PART_BUILD}/jlink"
      # replace the deb's full module image and its release file with the jlinked ones
      install -m 0644 "${CRAFT_PART_BUILD}/jlink/lib/modules" "${CRAFT_PART_INSTALL}/${JAVA_HOME}/lib/modules"
      install -m 0644 "${CRAFT_PART_BUILD}/jlink/release" "${CRAFT_PART_INSTALL}/${JAVA_HOME}/release"

      # lib/security/cacerts is a symlink to this keystore, as in the deb
      KEYSTORE="${CRAFT_PART_INSTALL}/etc/ssl/certs/java/cacerts"
      mkdir -p "$(dirname "${KEYSTORE}")"
      rm -f "${KEYSTORE}"
      for cert in "${BUILD_ROOT}"/usr/share/ca-certificates/mozilla/*.crt; do
        name="$(basename "${cert}" .crt)"
        # some certificate file names are not ascii
        LC_ALL=C.UTF-8 "${BUILD_JAVA_HOME}/bin/keytool" -importcert -noprompt -storetype JKS \
          -keystore "${KEYSTORE}" -storepass changeit \
          -alias "debian:${name}.crt" -file "${cert}" >/dev/null
      done

      cd "${CRAFT_PART_INSTALL}"
      mkdir -p usr/bin
      for tool in java jfr jrunscript jwebserver keytool rmiregistry; do
        ln -s --relative "${JAVA_HOME}/bin/${tool}" usr/bin/
      done

  deb-security-manifest:
    plugin: make
    after:
      - runtime
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: |
      gen_manifest
      craftctl default
